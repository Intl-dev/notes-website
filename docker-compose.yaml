version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  script:
    build: ./backend
    ports:
      - "9000:9000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      SECRET: ${SECRET}
      DATABASE_URL: ${DATABASE_URL}

  
