<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Auth Container (Login/Signup) -->
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <h1>Notes App</h1>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login</button>
                <p class="auth-toggle">Don't have an account? <a href="#" onclick="toggleAuthForm(event)">Sign up</a></p>
                <div id="loginError" class="error-message"></div>
                <div id="loginLoading" class="loading-indicator" style="display: none;">Logging in...</div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <h2>Sign Up</h2>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                <button type="submit" class="btn-primary">Sign Up</button>
                <p class="auth-toggle">Already have an account? <a href="#" onclick="toggleAuthForm(event)">Login</a></p>
                <div id="signupError" class="error-message"></div>
                <div id="signupLoading" class="loading-indicator" style="display: none;">Creating account...</div>
            </form>
        </div>
    </div>

    <!-- App Container (Notes) -->
    <div id="appContainer" class="app-container" style="display: none;">
        <header class="app-header">
            <h1>My Notes</h1>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </header>

        <main class="app-main">
            <!-- Note Input Section -->
            <div class="note-input-section">
                <textarea id="noteInput" placeholder="What's on your mind? (Press Enter to add)" rows="3"></textarea>
                <button id="addNoteBtn" class="btn-primary">Add Note</button>
            </div>

            <!-- Notes Grid -->
            <div id="notesGrid" class="notes-grid"></div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <p>No notes yet. Start by adding one above!</p>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
            <h2>Edit Note</h2>
            <textarea id="editNoteTextarea" rows="6"></textarea>
            <div class="modal-buttons">
                <button id="saveNoteBtn" class="btn-primary">Save</button>
                <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
